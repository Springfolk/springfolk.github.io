<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Springfolk on GitHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // a missing page: under a project's path (/alaas-game/…) its repo, else the organisation
  const p = location.pathname.split('/').filter(Boolean)[0];
  location.replace('https://github.com/Springfolk' + (p && /^[\w.-]+$/.test(p) ? '/' + p : ''));
</script>
</head>
<body>
<p>Not found. Springfolk's open-source projects are on <a href="https://github.com/Springfolk">github.com/Springfolk</a>.</p>
</body>
</html>
